name: Swift tests

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test-core:
    name: swift test (Linux)
    runs-on: ubuntu-24.04
    container:
      image: swift:6.2.4-noble
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Linux guard
        run: bash scripts/linux-guard.sh

      - name: Test PashtoCore
        working-directory: Packages/PashtoCore
        run: swift test

      - name: Test PashtoContentTool
        working-directory: Tools/PashtoContentTool
        run: swift test

      - name: Check generated content.json
        run: swift run --package-path Tools/PashtoContentTool pashto-content merge --check

      - name: Validate content for dev
        run: swift run --package-path Tools/PashtoContentTool pashto-content validate --mode dev

  # Runs on every pull request so release gaps stay visible.
  # Findings warn and the job stays green: exit 0 (warnings or review text, or no findings) and exit 1 (error findings).
  # Any other exit code fails the step. Not required for merge. Strict on the future release/TestFlight workflow.
  release-gate:
    name: release gate
    runs-on: ubuntu-24.04
    container:
      image: swift:6.2.4-noble
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build PashtoContentTool
        run: swift build --package-path Tools/PashtoContentTool
      - name: Validate content for release (findings warn, errors fail)
        shell: bash
        run: |
          set +e
          OUTPUT="$(swift run --skip-build --package-path Tools/PashtoContentTool pashto-content validate --mode release)"
          code=$?
          # 0: no error findings (stdout may still list warning/review). 1: error findings.
          # Anything else (usage is 2, crash/signal is 128+n) fails the step.
          case "$code" in
            0|1) ;;
            *)
              echo "pashto-content validate --mode release failed with exit code ${code}"
              if [ -n "$OUTPUT" ]; then
                printf '%s\n' "$OUTPUT"
              fi
              exit "$code"
              ;;
          esac
          {
            echo "### Release gate findings"
            if [ -z "$OUTPUT" ]; then
              echo ""
              echo "No findings."
            else
              echo ""
              echo '```'
              echo "$OUTPUT"
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$OUTPUT" ]; then
            while IFS= read -r line; do
              [ -z "$line" ] && continue
              sev="$(echo "$line" | cut -f1)"
              id="$(echo "$line" | cut -f2)"
              field="$(echo "$line" | cut -f3)"
              msg="$(echo "$line" | cut -f4-)"
              # Findings only warn, so error lines (exit 1) and warning lines (exit 0) keep the job green.
              if [ -n "$id" ]; then
                echo "::warning::[$field][$sev][$id] $msg"
              else
                echo "::warning::[$field][$sev] $msg"
              fi
            done <<< "$OUTPUT"
          fi
          exit 0
