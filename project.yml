# Source of truth for PashtoApp.xcodeproj.
#
# Edit this file, regenerate, and commit the project in the same change:
#   xcodegen generate
# The committed project was generated with XcodeGen 2.46.0.
# Do not hand-edit PashtoApp.xcodeproj.
#
# Bundle id: com.mangallabs.pashto
# Final. Chosen for Mangal Labs.
name: PashtoApp
options:
  bundleIdPrefix: com.mangallabs
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  # English only. Base is Xcode's default internationalization region for a new app.
  knownRegions:
    - en
    - Base
  createIntermediateGroups: true
  groupSortPosition: top
  minimumXcodeGenVersion: "2.46.0"
  # Pinned so Linux and macOS generate the same LastUpgradeCheck / object version.
  # Xcode 16 project format. Newer Xcode opens it and can upgrade later.
  xcodeVersion: "16.4"
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    STRING_CATALOG_GENERATE_SYMBOLS: YES
packages:
  PashtoCore:
    path: Packages/PashtoCore
targets:
  PashtoApp:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: PashtoApp
    dependencies:
      - package: PashtoCore
    settings:
      base:
        # Final bundle id for Mangal Labs.
        PRODUCT_BUNDLE_IDENTIFIER: com.mangallabs.pashto
        PRODUCT_NAME: PashtoApp
        CODE_SIGN_IDENTITY: "Apple Development"
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: PashtoApp/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        ENABLE_PREVIEWS: YES
schemes:
  PashtoApp:
    build:
      targets:
        PashtoApp: all
    run:
      config: Debug
    archive:
      config: Release
    profile:
      config: Release
    analyze:
      config: Debug
