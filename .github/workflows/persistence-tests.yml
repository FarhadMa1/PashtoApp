name: SwiftData tests

# Linux cannot build SwiftData. This job is the macOS check for that package.
# It stays off the Linux workflow so a core-only change still runs there,
# and so this runner is not started for unrelated files.
on:
  pull_request:
    paths:
      - "Packages/PashtoPersistence/**"
      - "Packages/PashtoCore/Sources/PashtoCore/Progress/**"
      - "Packages/PashtoCore/Sources/PashtoCoreTesting/**"
      - ".github/workflows/persistence-tests.yml"
  push:
    branches:
      - main
    paths:
      - "Packages/PashtoPersistence/**"
      - "Packages/PashtoCore/Sources/PashtoCore/Progress/**"
      - "Packages/PashtoCore/Sources/PashtoCoreTesting/**"
      - ".github/workflows/persistence-tests.yml"

permissions:
  contents: read

jobs:
  test-persistence:
    name: swift test (macOS)
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show Swift version
        run: |
          xcrun swift --version
          xcrun swift --version | grep -q "Swift version 6"

      - name: Test PashtoPersistence
        run: swift test --package-path Packages/PashtoPersistence
