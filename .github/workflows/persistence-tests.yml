name: SwiftData tests

# Linux cannot build SwiftData. This job is the macOS check for that package.
# It stays off the Linux workflow so a core-only change still runs there,
# and so this runner is not started for unrelated files.
on:
  pull_request:
    paths:
      - "Packages/PashtoPersistence/**"
      - "Packages/PashtoPersistence/Package.swift"
      - "Packages/PashtoCore/Sources/**"
      - "Packages/PashtoCore/Package.swift"
      - ".github/workflows/persistence-tests.yml"
  push:
    branches:
      - main
    paths:
      - "Packages/PashtoPersistence/**"
      - "Packages/PashtoPersistence/Package.swift"
      - "Packages/PashtoCore/Sources/**"
      - "Packages/PashtoCore/Package.swift"
      - ".github/workflows/persistence-tests.yml"

permissions:
  contents: read

jobs:
  test-persistence:
    name: swift test (macOS)
    runs-on: macos-15
    # actions: write is only for the Schema V1 store artifact below.
    # Checkout still needs contents: read. Job permissions replace the
    # workflow permissions, so contents: read is repeated here.
    permissions:
      contents: read
      actions: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 26.3
        # maxim-lobanov/setup-xcode v1.7.0
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90
        with:
          xcode-version: "26.3"

      - name: Show Swift version
        run: |
          xcrun swift --version
          xcrun swift --version | grep -q "Swift version 6"

      - name: Test PashtoPersistence
        run: swift test --package-path Packages/PashtoPersistence

      # Purpose: ADR 0001 says this macOS job generates the V1 .store that is
      # checked in before the first TestFlight build. The test opens SchemaV1
      # through ProgressContainer. It does not archive the app or upload to
      # App Store Connect. The artifact is the file to commit. Remove this
      # step once that file is in git.
      - name: Generate the Schema V1 store
        run: |
          set -euo pipefail
          xcodebuild -version
          xcrun swift --version
          echo "generator-commit $(git rev-parse HEAD)"
          out="${RUNNER_TEMP}/SchemaV1.store"
          rm -f "$out" "${out}-wal" "${out}-shm"
          PASHTO_SCHEMA_V1_STORE="$out" swift test --package-path Packages/PashtoPersistence --filter writesSchemaV1StoreWhenRequested
          test -s "$out"
          test ! -e "${out}-wal"
          test ! -e "${out}-shm"
          shasum -a 256 "$out"

      - name: Upload the Schema V1 store
        uses: actions/upload-artifact@v4
        with:
          name: schema-v1-store
          path: ${{ runner.temp }}/SchemaV1.store
          if-no-files-found: error
          retention-days: 5
