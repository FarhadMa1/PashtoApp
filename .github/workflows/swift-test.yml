name: Swift tests

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test-core:
    name: swift test (Linux)
    runs-on: ubuntu-24.04
    container:
      image: swift:6.2.4-noble
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Linux guard
        run: bash scripts/linux-guard.sh

      - name: Test PashtoCore
        working-directory: Packages/PashtoCore
        run: swift test

      - name: Test PashtoContentTool
        working-directory: Tools/PashtoContentTool
        run: swift test

      - name: Check generated content.json
        run: swift run --package-path Tools/PashtoContentTool pashto-content merge --check

      - name: Validate content for dev
        run: swift run --package-path Tools/PashtoContentTool pashto-content validate --mode dev

  # Runs on every pull request so release gaps stay visible.
  # Findings warn and the job stays green: exit 0, and exit 1 only when stdout has
  # error/warning/review lines in the tool format (severity, tab, id, tab, field, tab, message).
  # A missing binary, exit 1 with no such lines, and any other exit code fail the step.
  # Not required for merge. Strict on the future release/TestFlight workflow.
  release-gate:
    name: release gate
    runs-on: ubuntu-24.04
    container:
      image: swift:6.2.4-noble
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build PashtoContentTool
        run: swift build --package-path Tools/PashtoContentTool
      - name: Require pashto-content binary
        shell: bash
        run: |
          bin="$(swift build --package-path Tools/PashtoContentTool --show-bin-path)"
          tool="${bin}/pashto-content"
          if [ ! -x "$tool" ]; then
            echo "::error::pashto-content is missing or not executable at ${tool}"
            exit 1
          fi
          echo "PASHTO_CONTENT_TOOL=${tool}" >> "$GITHUB_ENV"
      - name: Validate content for release (findings warn, errors fail)
        shell: bash
        run: |
          if [ ! -x "${PASHTO_CONTENT_TOOL:-}" ]; then
            echo "::error::pashto-content is missing or not executable at ${PASHTO_CONTENT_TOOL:-<unset>}"
            exit 1
          fi
          stdout_file="$(mktemp)"
          stderr_file="$(mktemp)"
          trap 'rm -f "$stdout_file" "$stderr_file"' EXIT
          set +e
          "$PASHTO_CONTENT_TOOL" validate --mode release >"$stdout_file" 2>"$stderr_file"
          code=$?
          OUTPUT="$(cat "$stdout_file")"
          ERR="$(cat "$stderr_file")"
          # IssueList prints one finding per line: severity, tab, id, tab, field, tab, message.
          findings=0
          while IFS= read -r line; do
            case "$line" in
              error$'\t'*|warning$'\t'*|review$'\t'*)
                findings=1
                break
                ;;
            esac
          done <<< "$OUTPUT"
          if [ "$code" -eq 1 ] && [ "$findings" -eq 0 ]; then
            echo "::error::pashto-content validate --mode release exited 1 with no findings"
            if [ -n "$OUTPUT" ]; then
              printf '%s\n' "$OUTPUT"
            fi
            if [ -n "$ERR" ]; then
              printf '%s\n' "$ERR"
            fi
            exit 1
          fi
          # 0: no error findings (stdout may still list warning/review).
          # 1 with finding lines: error findings, still only warnings.
          # Anything else (usage is 2, crash/signal is 128+n) fails the step.
          case "$code" in
            0|1) ;;
            *)
              echo "::error::pashto-content validate --mode release failed with exit code ${code}"
              if [ -n "$OUTPUT" ]; then
                printf '%s\n' "$OUTPUT"
              fi
              if [ -n "$ERR" ]; then
                printf '%s\n' "$ERR"
              fi
              exit "$code"
              ;;
          esac
          if [ -n "$ERR" ]; then
            printf '%s\n' "$ERR" >&2
          fi
          {
            echo "### Release gate findings"
            if [ -z "$OUTPUT" ]; then
              echo ""
              echo "No findings."
            else
              echo ""
              echo '```'
              echo "$OUTPUT"
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$OUTPUT" ]; then
            while IFS= read -r line; do
              [ -z "$line" ] && continue
              sev="$(echo "$line" | cut -f1)"
              id="$(echo "$line" | cut -f2)"
              field="$(echo "$line" | cut -f3)"
              msg="$(echo "$line" | cut -f4-)"
              # Findings only warn, so error lines (exit 1) and warning lines (exit 0) keep the job green.
              if [ -n "$id" ]; then
                echo "::warning::[$field][$sev][$id] $msg"
              else
                echo "::warning::[$field][$sev] $msg"
              fi
            done <<< "$OUTPUT"
          fi
          exit 0
