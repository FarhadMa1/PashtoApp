name: App build

# The Xcode project is generated from project.yml. This job fails when the
# committed project drifts, then builds the app for the iOS Simulator.
on:
  pull_request:
    paths:
      - "PashtoApp/**"
      - "project.yml"
      - "PashtoApp.xcodeproj/**"
      - "Packages/**"
      - ".github/workflows/app-build.yml"
  push:
    branches:
      - main
    paths:
      - "PashtoApp/**"
      - "project.yml"
      - "PashtoApp.xcodeproj/**"
      - "Packages/**"
      - ".github/workflows/app-build.yml"

permissions:
  contents: read

jobs:
  build-app:
    name: app build (macOS)
    # Temporary. The newer-schema trace needs the macOS runner. This job is
    # turned back on before the final head.
    if: false
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 26.3
        # maxim-lobanov/setup-xcode v1.7.0
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90
        with:
          xcode-version: "26.3"

      - name: Generate the Xcode project
        run: |
          brew install xcodegen
          version="$(xcodegen --version)"
          if [ "$version" != "Version: 2.46.0" ]; then
            echo "::error::Expected XcodeGen 2.46.0, found ${version}. The committed project was generated with that version."
            exit 1
          fi
          xcodegen generate
          git diff --exit-code -- PashtoApp.xcodeproj

      - name: Build PashtoApp
        run: |
          xcodebuild build \
            -project PashtoApp.xcodeproj \
            -scheme PashtoApp \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO
