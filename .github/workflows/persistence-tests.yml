name: SwiftData tests

# Linux cannot build SwiftData. This job is the macOS check for that package.
# It stays off the Linux workflow so a core-only change still runs there,
# and so this runner is not started for unrelated files.
on:
  pull_request:
    paths:
      - "Packages/PashtoPersistence/**"
      - "Packages/PashtoPersistence/Package.swift"
      - "Packages/PashtoCore/Sources/**"
      - "Packages/PashtoCore/Package.swift"
      - ".github/workflows/persistence-tests.yml"
  push:
    branches:
      - main
    paths:
      - "Packages/PashtoPersistence/**"
      - "Packages/PashtoPersistence/Package.swift"
      - "Packages/PashtoCore/Sources/**"
      - "Packages/PashtoCore/Package.swift"
      - ".github/workflows/persistence-tests.yml"

permissions:
  contents: read

jobs:
  test-persistence:
    name: swift test (macOS)
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 26.3
        # maxim-lobanov/setup-xcode v1.7.0
        uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90
        with:
          xcode-version: "26.3"

      - name: Show Swift version
        run: |
          xcrun swift --version
          xcrun swift --version | grep -q "Swift version 6"

      # Temporary. Repeats the newer-schema byte check before and after the
      # open-path fix. Delete this step on the final head.
      - name: Repeat newer schema file check
        continue-on-error: true
        run: |
          set +e
          pass=0
          fail=0
          mkdir -p /tmp/schema-repeat
          for i in $(seq 1 20); do
            swift test --package-path Packages/PashtoPersistence --filter newerSchemaFileIsLeftUntouched > "/tmp/schema-repeat/run-$i.log" 2>&1
            code=$?
            if [ "$code" -eq 0 ]; then
              pass=$((pass + 1))
              echo "SCHEMA_REPEAT run=$i result=pass"
            else
              fail=$((fail + 1))
              echo "SCHEMA_REPEAT run=$i result=fail exit=$code"
              grep "SCHEMA-DIAG" "/tmp/schema-repeat/run-$i.log" || true
              grep "Expectation failed" "/tmp/schema-repeat/run-$i.log" || true
            fi
          done
          echo "SCHEMA_REPEAT summary pass=$pass fail=$fail"
          echo "----- SCHEMA-DIAG run 1 -----"
          grep "SCHEMA-DIAG" /tmp/schema-repeat/run-1.log || true
          {
            echo "### newerSchemaFileIsLeftUntouched x20"
            echo "pass=$pass fail=$fail"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Test PashtoPersistence
        run: swift test --package-path Packages/PashtoPersistence
